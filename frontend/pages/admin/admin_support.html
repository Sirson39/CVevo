<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Center | CVevo Admin</title>

  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../assets/css/dashboard.css" />

  <style>
    .admin-dashboard-container { padding: 40px; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
    .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; }
    .mini-stat-card { background:#fff; padding:24px; border-radius:20px; border:1px solid #e2e8f0; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05); }
    .mini-stat-card span { display:block; font-size:0.85rem; font-weight:700; color:#64748b; text-transform:uppercase; }
    .mini-stat-card strong { font-size:2rem; font-weight:800; color:#1e293b; display:block; margin-top:10px; }
    .grid-card { background:#fff; padding:24px; border-radius:20px; border:1px solid #e2e8f0; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05); }
    .table-responsive { overflow-x:auto; margin-top:15px; }
    .data-table { width:100%; border-collapse:collapse; text-align:left; }
    .data-table th { padding:12px 15px; border-bottom:1px solid #f1f5f9; color:#64748b; font-size:0.8rem; text-transform:uppercase; font-weight:700; }
    .data-table td { padding:16px 15px; border-bottom:1px solid #f8fafc; vertical-align:middle; }
    .ticket-small { font-size:0.8rem; color:#64748b; margin-top:4px; line-height:1.4; }
    .ticket-meta { display:flex; flex-direction:column; gap:2px; }
    .ticket-source { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; background:#f8fafc; color:#475569; font-size:0.72rem; font-weight:700; width:fit-content; margin-bottom:6px; }
    .badge { padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:700; }
    .badge.resolved { background:#dcfce7; color:#15803d; }
    .badge.pending { background:#fff7ed; color:#ea580c; }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .action-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:10px; font-size:0.8rem; font-weight:700; cursor:pointer; border:none; }
    .action-btn.resolve { background:#dcfce7; color:#15803d; }
    .action-btn.delete { background:#fee2e2; color:#b91c1c; }
    .admin-btn { border:1px solid #e2e8f0; padding:10px 18px; border-radius:12px; display:flex; align-items:center; gap:8px; font-weight:700; color:#1e293b; text-decoration:none; font-size:0.9rem; }
  </style>
</head>
<body class="app-body">
  <div class="app">
    <div id="sidebarMount"></div>
    <div class="main">
      <div id="topbarMount"></div>

      <main class="content">
        <div class="admin-dashboard-container">
          <div class="admin-header">
            <div>
              <h1>Support Center</h1>
              <p>Resolve user issues and track support ticket priority.</p>
            </div>
            <a href="./super_admin_dashboard.html" class="admin-btn">Dashboard</a>
          </div>

          <div id="statsRow" class="stats-row"></div>

          <div class="grid-card" style="margin-top:30px;">
            <h3>Support Tickets</h3>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Ticket</th>
                    <th>Requester</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="ticketsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/app-layout.js"></script>
  <script>
    initAppLayout({
      pageKey: "admin_support",
      title: "Support Center",
      subtitle: "Support tickets and messages"
    });

    function ticketUrl(id, kind, suffix = "") {
      const query = kind ? `?kind=${encodeURIComponent(kind)}` : "";
      return `/api/admin/support/${id}/${suffix}${query}`;
    }

    function escapeAttr(value) {
      return encodeURIComponent(String(value ?? ""));
    }

    async function resolveTicket(id, kind) {
      const confirmed = window.appConfirm
        ? await window.appConfirm({
            title: "Resolve Ticket?",
            message: "Mark this support item as resolved?",
            confirmText: "Yes, Resolve",
            cancelText: "Cancel",
            iconType: "warning"
          })
        : confirm("Mark this support item as resolved?");

      if (!confirmed) return;

      try {
        const res = await fetch(ticketUrl(id, kind, "resolve/"), {
          method: "POST",
          credentials: "include"
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Failed to resolve ticket.");
        }
        loadSupport();
      } catch (err) {
        console.error(err);
        alert(err.message || "Failed to resolve ticket.");
      }
    }

    async function deleteTicket(id, kind, subject) {
      const confirmed = window.appConfirm
        ? await window.appConfirm({
            title: "Delete Ticket?",
            message: `Delete "${subject}" permanently? This action cannot be undone.`,
            confirmText: "Yes, Delete",
            cancelText: "Cancel",
            iconType: "warning"
          })
        : confirm(`Delete "${subject}" permanently?`);

      if (!confirmed) return;

      try {
        const res = await fetch(ticketUrl(id, kind), {
          method: "DELETE",
          credentials: "include"
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Failed to delete ticket.");
        }
        loadSupport();
      } catch (err) {
        console.error(err);
        alert(err.message || "Failed to delete ticket.");
      }
    }

    async function loadSupport() {
      try {
        const res = await fetch("/api/admin/support/", {
          credentials: "include"
        });
        const data = await res.json();

        document.getElementById("statsRow").innerHTML = (data.show_stats || []).map(item => `
          <div class="mini-stat-card">
            <span>${item.label}</span>
            <strong>${item.value}</strong>
          </div>
        `).join("");

        const tickets = data.tickets || [];
        const tbody = document.getElementById("ticketsTableBody");
        tbody.innerHTML = tickets.length ? tickets.map(ticket => `
          <tr>
            <td>
              <div class="ticket-meta">
                <span class="ticket-source">${ticket.source_label || "Support Item"}</span>
                <strong>${ticket.subject || ""}</strong>
                <p class="ticket-small">${ticket.message || ""}</p>
              </div>
            </td>
            <td>
              <strong>${ticket.requester_name || ticket.user_name || ""}</strong>
              ${ticket.requester_email ? `<p class="ticket-small">${ticket.requester_email}</p>` : ""}
            </td>
            <td>
              <span class="badge ${ticket.is_resolved ? "resolved" : "pending"}">
                ${ticket.is_resolved ? "Resolved" : "Open"}
              </span>
            </td>
            <td>${ticket.created_at || ""}</td>
            <td class="actions">
              ${ticket.is_resolved ? "" : `<button class="action-btn resolve" type="button" data-ticket-action="resolve" data-ticket-id="${ticket.id}" data-ticket-kind="${ticket.kind || ""}" data-ticket-subject="${escapeAttr(ticket.subject)}">Resolve</button>`}
              <button class="action-btn delete" type="button" data-ticket-action="delete" data-ticket-id="${ticket.id}" data-ticket-kind="${ticket.kind || ""}" data-ticket-subject="${escapeAttr(ticket.subject)}">Delete</button>
            </td>
          </tr>
        `).join("") : `
          <tr>
            <td colspan="5" style="padding: 2rem; text-align: center; color: #64748b;">
              No support messages found yet.
            </td>
          </tr>
        `;

        tbody.onclick = async (event) => {
          const button = event.target.closest("button[data-ticket-action]");
          if (!button) return;
          const id = button.dataset.ticketId;
          const kind = button.dataset.ticketKind;
          const subject = decodeURIComponent(button.dataset.ticketSubject || "this%20ticket");

          if (button.dataset.ticketAction === "resolve") {
            await resolveTicket(id, kind);
          } else if (button.dataset.ticketAction === "delete") {
            await deleteTicket(id, kind, subject);
          }
        };
      } catch (err) {
        console.error(err);
        document.getElementById("statsRow").innerHTML = `
          <div class="mini-stat-card">
            <span>Error</span>
            <strong>Failed</strong>
          </div>
        `;
        document.getElementById("ticketsTableBody").innerHTML = `
          <tr>
            <td colspan="5" style="padding: 2rem; text-align: center; color: #ef4444;">
              ${err.message || "Failed to load support tickets."}
            </td>
          </tr>
        `;
      }
    }

    loadSupport();
  </script>
</body>
</html>
